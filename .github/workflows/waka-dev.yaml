name: WakaTime Dev Metrics

on:
  workflow_dispatch: # for manual workflow trigger
  schedule:
    - cron: "30 22 * * *" # 30 min after the yearly stats, avoids commit races

concurrency:
  group: profile-readme
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-readme:
    name: Update Readme with Dev Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.PERSONAL_PROFILE }}
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECTION_NAME: waka
          LOCALE: "en"
          SHOW_OS: "True"
          SHOW_PROJECTS: "True"
          SHOW_EDITORS: "True"
          SHOW_TIMEZONE: "True"
          SHOW_COMMIT: "True"
          SHOW_LANGUAGE: "True"
          SHOW_LANGUAGE_PER_REPO: "True"
          SHOW_DAYS_OF_WEEK: "True"
          SHOW_SHORT_INFO: "True"
          SHOW_PROFILE_VIEWS: "True"
          SHOW_UPDATED_DATE: "True"
          SHOW_TOTAL_CODE_TIME: "True"
          SHOW_AI_CODE_TIME: "True"
          SHOW_AI_CODING: "True"
          # heavy, walks every repository; keep off
          SHOW_LINES_OF_CODE: "False"
          SHOW_LOC_CHART: "False"
          COMMIT_MESSAGE: "chore: update dev metrics"
